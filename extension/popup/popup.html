<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SofaView</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="head">
    <img class="logo" src="../icons/icon48.png" alt="" width="32" height="32">
    <div class="name"><span class="title">SofaView</span><span class="ver" id="ver"></span></div>
    <button type="button" class="icon-btn" id="open-all" title="すべての設定を開く" aria-label="すべての設定を開く">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M19.14 12.94a7.07 7.07 0 0 0 .06-.94 7.07 7.07 0 0 0-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.61-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96a.5.5 0 0 0-.61.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58a7.07 7.07 0 0 0-.06.94c0 .32.02.63.06.94L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32c.13.22.39.31.61.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.04.24.25.42.5.42h3.84c.25 0 .46-.18.5-.42l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.09.48 0 .61-.22l1.92-3.32a.5.5 0 0 0-.12-.64zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/></svg>
    </button>
  </header>

  <main id="rows" class="rows" aria-live="polite"></main>

  <footer class="foot">
    <button type="button" class="link" id="open-hub">ハブを開く</button>
    <button type="button" class="link" id="open-keys">キー割り当て</button>
    <button type="button" class="link" id="open-diag">キー診断</button>
    <button type="button" class="link danger" id="reset">設定を初期化</button>
  </footer>
  <p class="credit">SofaView ・ by fumi24</p>

  <script src="../common/sv.js"></script>
  <script src="../common/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
